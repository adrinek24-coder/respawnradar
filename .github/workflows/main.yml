name: Publish gaming news
on:
  schedule:
     # 06:30 UTC (07:30 PL), 13:30 UTC (14:30 PL), 20:30 UTC (21:30 PL)
    - cron: '30 6,13,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: RespawnPing-autopublish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Generate articles
        id: generate
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '2' }}
        run: python bot/hunter.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build before publishing
        working-directory: web
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm ci && npm run build
      - name: Commit and push
        run: |
          git add -- ':(glob)web/src/content/posts/*/*.md' data/published_trends.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish RespawnPing articles'
          git push origin HEAD:main
      - name: Report generation failures
        if: steps.generate.outcome == 'failure'
        run: exit 1
